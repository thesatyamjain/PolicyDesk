name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-tag starting at v0.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine & Create Release Tag
        id: release-tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            # Ensure 'v' prefix
            if [[ ! "$TAG" =~ ^v ]]; then
              TAG="v$TAG"
            fi
            echo "Using manual tag: $TAG"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              TAG="v0.0.1"
              echo "No existing tags found. Starting initial tag at: $TAG"
            else
              RAW="${LATEST_TAG#v}"
              MAJOR=$(echo "$RAW" | cut -d. -f1)
              MINOR=$(echo "$RAW" | cut -d. -f2)
              PATCH=$(echo "$RAW" | cut -d. -f3)
              if [ -n "$PATCH" ]; then
                NEW_PATCH=$((PATCH + 1))
                TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
              else
                TAG="v0.0.1"
              fi
              echo "Auto-incremented from $LATEST_TAG to: $TAG"
            fi

            # Configure git and push tag to repository
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag "$TAG"
              git push origin "$TAG"
            fi
          else
            TAG="${{ github.ref_name }}"
            echo "Triggered by pushed tag: $TAG"
          fi

          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Release Keystore (if secrets configured)
        id: keystore-setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom keystore secret provided. Falling back to default signing configuration."
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK & App Bundle
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Release Artifacts
        id: prepare-artifacts
        run: |
          TAG="${{ steps.release-tag.outputs.TAG }}"
          mkdir -p release-dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-dist/PolicyDesk-$TAG.apk"
          fi
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "release-dist/PolicyDesk-$TAG.aab"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.TAG }}
          name: "PolicyDesk ${{ steps.release-tag.outputs.TAG }}"
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
