name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      tag_name:
        description: 'Custom tag override (optional, e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ─── JOB 1: DETERMINE & CREATE TAG ──────────────────────────────────────────
  init:
    name: Initialize Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine & Create Release Tag
        id: release-tag
        run: |
          BUMP_TYPE="${{ github.event.inputs.version_type }}"
          CUSTOM_TAG="${{ github.event.inputs.tag_name }}"

          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
            if [[ ! "$TAG" =~ ^v ]]; then
              TAG="v$TAG"
            fi
            echo "Using manual tag override: $TAG"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              case "$BUMP_TYPE" in
                major) TAG="v1.0.0" ;;
                minor|*) TAG="v0.1.0" ;;
              esac
              echo "No existing tags found. Starting initial tag at: $TAG ($BUMP_TYPE)"
            else
              RAW="${LATEST_TAG#v}"
              MAJOR=$(echo "$RAW" | cut -d. -f1)
              MINOR=$(echo "$RAW" | cut -d. -f2)
              PATCH=$(echo "$RAW" | cut -d. -f3)

              MAJOR=${MAJOR:-0}
              MINOR=${MINOR:-0}
              PATCH=${PATCH:-0}

              case "$BUMP_TYPE" in
                major)
                  NEW_MAJOR=$((MAJOR + 1))
                  TAG="v${NEW_MAJOR}.0.0"
                  ;;
                minor)
                  NEW_MINOR=$((MINOR + 1))
                  TAG="v${MAJOR}.${NEW_MINOR}.0"
                  ;;
                patch|*)
                  NEW_PATCH=$((PATCH + 1))
                  TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
                  ;;
              esac
              echo "Auto-incremented from $LATEST_TAG ($BUMP_TYPE) to: $TAG"
            fi

            # Configure git and push tag to repository
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag "$TAG"
              git push origin "$TAG"
            fi
          else
            TAG="${{ github.ref_name }}"
            echo "Triggered by pushed tag: $TAG"
          fi

          echo "TAG=$TAG" >> $GITHUB_OUTPUT

  # ─── PARALLEL JOB 2A: RUN UNIT TESTS ────────────────────────────────────────
  test:
    name: Run Unit Tests
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

  # ─── PARALLEL JOB 2B: COMPILE RELEASE APK ────────────────────────────────────
  build-apk:
    name: Build Release APK
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Release Keystore (if secrets configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK Artifact
        run: |
          TAG="${{ needs.init.outputs.tag }}"
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/PolicyDesk-$TAG.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: artifacts/*.apk
          retention-days: 1

  # ─── PARALLEL JOB 2C: COMPILE APP BUNDLE (.AAB) ──────────────────────────────
  build-bundle:
    name: Build Release App Bundle
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Release Keystore (if secrets configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Build Release Bundle
        run: ./gradlew bundleRelease --no-daemon

      - name: Stage Bundle Artifact
        run: |
          TAG="${{ needs.init.outputs.tag }}"
          mkdir -p artifacts
          cp app/build/outputs/bundle/release/app-release.aab "artifacts/PolicyDesk-$TAG.aab"

      - name: Upload Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: artifacts/*.aab
          retention-days: 1

  # ─── JOB 3: PUBLISH GITHUB RELEASE ──────────────────────────────────────────
  publish:
    name: Publish Release
    needs: [init, test, build-apk, build-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-dist

      - name: Display Staged Artifacts
        run: ls -la release-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init.outputs.tag }}
          name: "PolicyDesk ${{ needs.init.outputs.tag }}"
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
